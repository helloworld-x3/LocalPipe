name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: >-
          python -m py_compile pipeline.py candidate_selection.py feishu_connector.py
          feishu_automation.py strategy.py kreado_adapter.py feishu_setup_tables.py
          feishu_metrics.py batch.py model.py baseline.py stats.py test_pipeline.py

      - name: Run offline behavior tests
        run: python -m unittest discover -v
